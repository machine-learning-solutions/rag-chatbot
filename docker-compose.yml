services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_secret
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    # Pin below 0.30: latest CUDA backend breaks on driver 535 (RTX 4060/3050).
    image: ollama/ollama:0.24.0
    gpus: all
    environment:
      # Finite keep-alive so the model unloads from VRAM after idle time,
      # freeing the shared 8GB GPU for other services (e.g. WeInterviewer's
      # SILMA TTS) instead of holding ~7GB forever. First request after an
      # idle period pays a reload cost instead of being instant.
      OLLAMA_KEEP_ALIVE: "5m"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # Unset ROCm hint so NVIDIA GPU discovery works in Docker (ollama/ollama#11852).
      ROCR_VISIBLE_DEVICES: ""
      # Quantized KV cache (needs flash attention) shrinks the attention
      # cache footprint so qwen2.5:14b leaves more of the shared 8GB GPU
      # free for other services (e.g. WeInterviewer's SILMA TTS).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.24.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen2.5:14b || true
        # Pre-load weights so the first visitor request stays under proxy timeouts.
        printf 'warmup' | ollama run qwen2.5:14b >/dev/null 2>&1 || true
        echo "Ollama model pull and warmup complete"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Embeddings on CPU — Ollama uses ~7 GB VRAM; both won't fit on 8 GB GPUs.
    environment:
      TORCH_DEVICE: cpu
      DATABASE_URL: postgresql+asyncpg://rag:rag_secret@postgres:5432/ragdb
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:14b
      EMBEDDING_MODEL: intfloat/multilingual-e5-large
      LLM_TEMPERATURE: "0.9"
      VECTOR_STORE_PATH: /app/data/vector_store
      UPLOAD_DIR: /app/data/uploads
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "64"
      TURBOVEC_BIT_WIDTH: "4"
      RERANKER_ENABLED: "false"
      RERANKER_MODEL: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      HYBRID_SEARCH_ENABLED: "true"
      # Cross-lingual Arabic→English is handled by multilingual-e5 + reranker;
      # LLM query expansion adds 10–60s and breaks portfolio proxy limits.
      QUERY_EXPANSION_ENABLED: "false"
      PORTFOLIO_QUERY_EXPANSION_ENABLED: "true"
      PORTFOLIO_QUERY_EXPANSION_TIMEOUT_SECONDS: "8"
      TOP_K: "5"
      RETRIEVAL_MIN_K: "6"
      RETRIEVAL_FETCH_MULTIPLIER: "2"
      RRF_K: "60"
      RERANKER_MIN_SCORE: "-0.5"
      CONTEXT_SCORE_MARGIN: "1.5"
      # Polish doubles LLM latency; keep off while GPU handles generation fast enough.
      ARABIC_POLISH_ENABLED: "false"
      MAX_CONTEXT_CHUNKS: "5"
      CONTEXT_CHUNK_MAX_CHARS: "2000"
      LLM_NUM_PREDICT: "512"
      PORTFOLIO_LLM_NUM_PREDICT: "2048"
      PORTFOLIO_LLM_NUM_PREDICT_MEDIUM: "1024"
      PORTFOLIO_LLM_NUM_PREDICT_SHORT: "512"
      PORTFOLIO_MAX_CONTEXT_CHUNKS: "10"
      PORTFOLIO_CONTEXT_CHUNK_MAX_CHARS: "2000"
      PORTFOLIO_CONTEXT_MAX_CHARS: "5500"
      PORTFOLIO_TOP_K: "10"
      PORTFOLIO_RETRIEVAL_MIN_K: "10"
      PORTFOLIO_RETRIEVAL_FETCH_MULTIPLIER: "2"
      PORTFOLIO_RERANKER_ENABLED: "false"
    volumes:
      - backend_data:/app/data
      - embedding_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

  # Single entry for ngrok: /api → backend, everything else → Streamlit.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/ngrok/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9080:9080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  backend_data:
  embedding_cache:
